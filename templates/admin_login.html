<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusNova — Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md px-6">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L13.5 8L19 6L15 10.5L21 12L15 13.5L19 18L13.5 16L12 22L10.5 16L5 18L9 13.5L3 12L9 10.5L5 6L10.5 8Z" fill="white"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">CampusNova</h1>
      <p class="text-gray-500 text-sm mt-1">Admin Portal</p>
    </div>

    <!-- Login box -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <h2 class="text-xl font-semibold text-white mb-2">Welcome back</h2>
      <p class="text-gray-500 text-sm mb-6">Only authorised college staff can access the admin portal.</p>

      <form action="/admin-login" method="POST" class="flex flex-col gap-4">

        <div>
          <label class="text-sm text-gray-400 mb-1 block">Email Address</label>
          <input
            type="email"
            name="email"
            placeholder="admin@college.edu"
            required
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition"
          />
        </div>

        <div>
          <label class="text-sm text-gray-400 mb-1 block">Password</label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            required
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition"
          />
        </div>

        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl text-sm font-medium transition w-full mt-2">
          Login as Admin →
        </button>

      </form>

      <p class="text-center text-gray-600 text-xs mt-6">
        Only authorised college staff can upload and manage documents.
      </p>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-gray-600 text-sm hover:text-white transition">← Back to Home</a>
    </div>

  </div>

</body>
</html>
