<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusNova — Admin Portal</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L13.5 8L19 6L15 10.5L21 12L15 13.5L19 18L13.5 16L12 22L10.5 16L5 18L9 13.5L3 12L9 10.5L5 6L10.5 8Z" fill="white"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white">CampusNova</h1>
        <p class="text-xs text-gray-500">Admin Portal</p>
      </div>
    </div>
    <a href="/" class="text-sm text-indigo-400 hover:text-indigo-300 border border-indigo-800 px-4 py-2 rounded-lg transition">
      ← Student Chat
    </a>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Welcome -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-white mb-1">Admin Dashboard 📁</h2>
      <p class="text-gray-400 text-sm">Upload college documents — CampusNova will process them and answer student questions!</p>
    </div>

    <!-- Upload form -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-8">
      <h3 class="text-lg font-semibold text-white mb-4">Upload New Document</h3>

      <form
        hx-post="/upload"
        hx-target="#documents-list"
        hx-swap="innerHTML"
        hx-encoding="multipart/form-data"
        class="flex flex-col gap-4">

        <!-- Document name -->
        <div>
          <label class="text-sm text-gray-400 mb-1 block">Document Name</label>
          <input
            type="text"
            name="doc_name"
            placeholder="e.g. BTech Admission Prospectus 2026"
            required
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none focus:border-indigo-500 transition"
          />
        </div>

        <!-- Category -->
        <div>
          <label class="text-sm text-gray-400 mb-1 block">Category</label>
          <select
            name="category"
            required
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-indigo-500 transition">
            <option value="">Select category...</option>
            <option value="Admission">📋 Admission</option>
            <option value="Fees">💰 Fees</option>
            <option value="Hostel">🏠 Hostel</option>
            <option value="Courses">📚 Courses</option>
            <option value="Scholarship">🎓 Scholarship</option>
            <option value="Placement">💼 Placement</option>
            <option value="Rules">📜 Rules</option>
            <option value="Notices">📢 Notices</option>
          </select>
        </div>

        <!-- File upload -->
        <div>
          <label class="text-sm text-gray-400 mb-1 block">PDF Document</label>
          <input
            type="file"
            name="file"
            accept=".pdf"
            required
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-300 outline-none focus:border-indigo-500 transition file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-xs file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl text-sm font-medium transition w-full">
          Upload & Process Document ✅
        </button>

      </form>
    </div>

    <!-- Uploaded documents -->
    <div>
      <h3 class="text-lg font-semibold text-white mb-4">Uploaded Documents</h3>
      <div id="documents-list" class="flex flex-col gap-3">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center">
          <p class="text-gray-500 text-sm">No documents uploaded yet.</p>
          <p class="text-gray-600 text-xs mt-1">Upload your first college document above!</p>
        </div>
      </div>
      </div>
    

  </main>

</body>
</html>
